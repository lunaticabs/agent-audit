apiVersion: v1
kind: Secret
metadata:
  name: agent-audit-runner-env
  namespace: agent-audit
type: Opaque
stringData:
  DEEPSEEK_API_KEY: replace-me
  DSH_MODEL: deepseek-flash
  DSH_REASONING_EFFORT: max
  ETHERSCAN_API_KEY: replace-me
  ETHERSCAN_API_URL: https://api.etherscan.io/v2/api
  # Also used by run_persist for eth_blockNumber when the run saved no block.
  RPC_URL: https://rpc.example.com

  # Per-run MongoDB archive. The runner writes one runs_meta document and that
  # run's own runs_files material after the audit finishes. Use the Test
  # database for smoke runs; never point validation at the production db.
  AGENT_AUDIT_MONGO_URI: mongodb://user:password@mongodb.example.com:27017/?authSource=admin
  AGENT_AUDIT_MONGO_DB: agent
  AGENT_AUDIT_MONGO_RUNS_META_COLLECTION: runs_meta
  AGENT_AUDIT_MONGO_RUNS_FILES_COLLECTION: runs_files
  AGENT_AUDIT_MONGO_MAX_INLINE_FILE_BYTES: "8388608"
