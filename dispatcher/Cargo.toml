[package]
name = "agent-audit-dispatcher"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
dotenvy = "0.15"
k8s-openapi = { version = "0.28", features = ["v1_36"] }
kube = { version = "4.2", default-features = false, features = ["client", "rustls-tls", "ring"] }
redis = { version = "1.8", default-features = false, features = ["tokio-comp", "streams"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }
